  <g transform="translate(64, 68)">
    <rect x="0" y="0" width="460" height="494" rx="8" fill="#1b1815" stroke="#eae2d7" stroke-opacity="0.12" stroke-width="1" />
    <!-- Subtle Mediterranean Coastal Band -->
    <rect x="1" y="1" width="458" height="108" rx="7" fill="url(#sea-wash)" />

    <!-- Minimalist Architectural Egypt Silhouette -->
    <path
      d="M72 108 L108 104 L152 114 L182 126 L208 118 L244 106 L278 108 L314 122 L346 118 L374 126 L362 174 L378 214 L366 254 L344 268 L316 218 L302 204 L298 228 L316 266 L342 320 L372 374 L398 418 L322 418 L224 418 L76 418 L74 340 L64 252 L66 170 Z"
      fill="#2d2925"
      stroke="#eae2d7"
      stroke-opacity="0.24"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Inlaid Brushed Brass Nile Valley & Delta Filament -->
    <path
      d="M244 416 L264 384 L282 346 L274 304 L264 274 L250 242 L236 206 L246 168 L242 152"
      fill="none"
      stroke="#cba152"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M242 152 L222 124 M242 152 L268 114"
      fill="none"
      stroke="#cba152"
      stroke-width="2.1"
      stroke-linecap="round"
    />

    <!-- Secondary Active Corridors (Cairo, Giza, North Coast, Red Sea, Sokhna) -->
    <circle cx="176" cy="126" r="4" fill="#cba152" fill-opacity="0.82" />
    <circle cx="256" cy="158" r="4.5" fill="#cba152" fill-opacity="0.88" />
    <circle cx="234" cy="160" r="4" fill="#cba152" fill-opacity="0.82" />
    <circle cx="290" cy="176" r="4" fill="#cba152" fill-opacity="0.82" />
    <circle cx="330" cy="264" r="4.5" fill="#cba152" fill-opacity="0.88" />

    <!-- Alexandria Flagship Double-Ring Brass Pin -->
    <circle cx="204" cy="120" r="14" fill="none" stroke="#cba152" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="204" cy="120" r="8" fill="none" stroke="#cba152" stroke-width="1.6" />
    <circle cx="204" cy="120" r="3.8" fill="#f3efe7" />

    <!-- Maquette Index Caption -->
    <text x="26" y="468" fill="#b0a496" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" letter-spacing="2">
      31.185° N · 29.915° E — ALEXANDRIA FLAGSHIP
    </text>
  </g>

  <!-- Right Editorial Typography Block -->
  <g transform="translate(574, 118)">
    <text x="0" y="0" fill="#cba152" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="2.4">01 · SENIOR PROPERTY CONSULTANT · EGYPT</text>
    <rect x="0" y="20" width="128" height="1.5" fill="#cba152" />

