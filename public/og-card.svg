    <!-- Subtitle (two balanced right-aligned Arabic lines strictly inside 540px column) -->
    <text
      x="540"
      y="202"
      text-anchor="start"
      direction="rtl"
      fill="#b0a496"
      font-family="'IBM Plex Sans Arabic', 'Cairo', sans-serif"
