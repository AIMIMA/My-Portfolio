    ><tspan x="540" dy="0">مستشار عقاري أول · ماكت 3D تفاعلي</tspan><tspan x="540" dy="30">وخرائط ماستر بلان لأبرز مشاريع مصر</tspan></text>

    <!-- Hairline Separator -->
    <line x1="0" y1="264" x2="540" y2="264" stroke="#eae2d7" stroke-opacity="0.14" stroke-width="1" />

    <!-- 3 Factual Metrics Strip -->
    <g transform="translate(0, 316)">
      <text x="0" y="0" fill="#cba152" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">6</text>
      <text x="0" y="26" fill="#b0a496" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Investment Corridors</text>

      <text x="190" y="0" fill="#cba152" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">22</text>
      <text x="190" y="26" fill="#b0a496" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Verified Master Plans</text>

      <text x="386" y="0" fill="#cba152" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">2D / 3D</text>
      <text x="386" y="26" fill="#b0a496" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Spatial Architecture</text>
    </g>

    <!-- Corridor Footer -->
    <text
      x="540"
      y="424"
      text-anchor="start"
      direction="rtl"
      fill="#9c9081"
      font-family="'IBM Plex Sans Arabic', 'Cairo', sans-serif"
