<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Abdullah Ibrahim Mohamed — Senior Property Consultant | Interactive 3D Egypt Real Estate Portfolio">
  <defs>
    <radialGradient id="studio-warm" cx="34%" cy="44%" r="68%">
      <stop offset="0%" stop-color="#221d17" />
      <stop offset="58%" stop-color="#191613" />
      <stop offset="100%" stop-color="#141210" />
    </radialGradient>
    <linearGradient id="sea-wash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#326d7b" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#141210" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="1200" height="630" fill="url(#studio-warm)" />

  <!-- Architectural Frame Hairline -->
  <rect x="28" y="28" width="1144" height="574" rx="10" fill="none" stroke="#eae2d7" stroke-opacity="0.14" stroke-width="1.2" />

